# 石墨工坊 · 自用 Debug APK 构建
# 与仓库既有约定一致：只产出 APK / 不碰 gh-pages 分支与 Pages 部署。
# 工具链版本全部钉死，避免 Vite 8 / TS 7 在 CI 上隐式漂移。
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.json'
      - 'local_modules/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 不放 setup-java 的 cache: gradle —— 它会扫描仓库里的 Gradle 构建文件，
      # 但 android/ 是后面由 cap add 现场生成的，首步必然无匹配而报错。
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest runner 自带 Android SDK，不引入第三方 setup action
      - name: Android SDK 35（runner 预装）
        run: |
          set -euxo pipefail
          : "${ANDROID_HOME:?runner 未提供 ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo 'sdkmanager 缺失'; ls -la "$ANDROID_HOME/cmdline-tools" || true; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' > /dev/null

      # 仓库刻意不提交 package-lock.json，这里沿用 npm install 且不写 lock；
      # Capacitor 三件套钉死版本，避免与网页构建产物产生漂移。
      - name: 安装 Web 依赖 + Capacitor 7.4.2
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            @capacitor/cli@7.4.2 @capacitor/core@7.4.2 @capacitor/android@7.4.2

      # file: 本地依赖在 npm install --no-save 下偶发被跳过，显式兜底一次；
      # cap sync 依据其 package.json 的 capacitor 字段注册 Java 插件。
      - name: 校验 Material You 原生插件
        run: |
          if [ ! -f node_modules/capacitor-material-you/package.json ]; then
            npm install --no-save --no-package-lock --no-audit --no-fund ./local_modules/capacitor-material-you
          fi
          test -f node_modules/capacitor-material-you/package.json
          test -f node_modules/capacitor-material-you/dist/index.js
          test -f node_modules/capacitor-material-you/android/src/main/java/com/materialyou/capacitor/MaterialYouPlugin.java
          node --input-type=commonjs -e "const p=require('./node_modules/capacitor-material-you/package.json'); if(!p.capacitor?.android?.src) process.exit(1); console.log('plugin:', p.name, p.version)"

      # 权威类型检查：Vite 只做转译不查类型，设置页全量 MD3 化后必须显式跑一次。
      - name: 类型检查
        run: npx tsc --noEmit

      # 失败时把「尾部 6 行」压成单条 annotation：GitHub 每个 job 只保留 10 条
      # annotation，之前用一条多行 ::error:: 会被拆行占满配额，真正报错反而被吞掉。
      - name: 构建 dist/
        run: |
          if ! NODE_OPTIONS=--max-old-space-size=4096 npm run build > /tmp/gw-build.log 2>&1; then
            echo '---- vite build 输出（尾部 40 行） ----'
            tail -n 40 /tmp/gw-build.log
            cp /tmp/gw-build.log ./gw-build.log
            python3 -c "import pathlib,re; L=[re.sub(r'\x1b\[[0-9;]*m','',x) for x in pathlib.Path('/tmp/gw-build.log').read_text(errors='replace').splitlines()]; print('::error:: '+' | '.join(x.replace('%','%25') for x in L[-40:]))"
            exit 1
          fi
          tail -n 12 /tmp/gw-build.log

      - name: 失败时上传完整构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gw-build-log
          path: gw-build.log
          if-no-files-found: ignore
          retention-days: 7

      # 不把 android/ 入库：每次由固定版本的 CLI 现场生成，工程可复现。
      - name: 生成并同步 Android 工程
        run: |
          test -f dist/index.html || { echo 'dist/index.html 缺失'; exit 1; }
          npx cap add android
          npx cap sync android
          test -f android/app/src/main/assets/capacitor.plugins.json
          grep -q 'capacitor-material-you' android/app/src/main/assets/capacitor.plugins.json || {
            echo 'Material You 插件未注册进 Android 工程'; cat android/app/src/main/assets/capacitor.plugins.json; exit 1; }
          echo 'capacitor.plugins.json:'; cat android/app/src/main/assets/capacitor.plugins.json
          grep -n 'compileSdkVersion\|targetSdkVersion\|minSdkVersion' android/variables.gradle

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 收集产物
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK" || { echo '未找到 APK'; exit 1; }
          cp "$APK" graphite-workshop-v3-debug.apk
          sha256sum graphite-workshop-v3-debug.apk
          ls -lh graphite-workshop-v3-debug.apk
          # 附带一份去掉中间产物的工程快照，方便本地用 Android Studio 二次开发
          tar -czf android-project.tar.gz \
            --exclude='android/build' --exclude='android/.gradle' \
            --exclude='android/local.properties' --exclude='android/app/build' \
            android/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: graphite-workshop-v3-apk
          path: |
            graphite-workshop-v3-debug.apk
            android-project.tar.gz
          retention-days: 30

      # 固定 tag，提供一个免登录、可长期复用的直链
      - name: 发布到 apk-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest graphite-workshop-v3-debug.apk --clobber
          else
            gh release create apk-latest graphite-workshop-v3-debug.apk \
              --title '石墨工坊 · Debug APK' \
              --notes '由 Build Android APK 工作流自动构建，debug 签名，下载后直接安装即可。源码更新后重跑工作流会覆盖此 APK。'
          fi

      # 网页与 APK 共用同一份 dist/：一次构建同步两端，避免站点停留在旧版。
      - name: 同步 Pages（dist/ → gh-pages）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "deploy: sync v3 UI (${GITHUB_SHA::7})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin HEAD:gh-pages
